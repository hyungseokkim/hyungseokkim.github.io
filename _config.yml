about_content: | # this will include new lines to allow paragraphs
  만 7년 경력의 <mark>웹 백엔드 개발자</mark>로, 신규 기능 개발보다는 <mark>기존 레거시 환경을 분석하고 개선하는 업무</mark>를 중심으로 실무 경험을 쌓아왔습니다. 서비스 종료, 데이터 불일치, 문서화되지 않은 코드 등 <mark>현업에서 자주 발생하는 제약 조건</mark> 속에서 시스템을 안정적으로 운영하는 역할을 주로 담당해왔습니다.

  <mark>Java(SpringBoot)</mark>, <mark>PHP</mark> 기반 백엔드 개발을 주력으로 하며, MySQL·PostgreSQL 등 주요 RDBMS를 활용한 <mark>데이터 구조 설계, 마이그레이션, 정합성 검증 로직 구현</mark> 경험이 풍부합니다. 특히 급여·근로 정보와 같이 <mark>정확성이 중요한 도메인</mark>에서 데이터 이관 및 검증 작업을 반복적으로 수행해왔습니다.

  기술 스택 자체보다 <mark>문제 상황을 구조적으로 정리하고 해결 가능한 형태로 만드는 과정</mark>을 중요하게 생각합니다. Git Flow 기반의 브랜치 전략을 활용해 변경 이력을 관리하고, Notion과 Swagger를 통해 시스템 흐름과 API 동작을 문서화하며 팀 내 공유를 진행해왔습니다. 기획자·디자이너 등 타 직군과의 협업 환경에서도 요구사항이 불명확한 상황을 정리해 실제 동작하는 결과물로 연결하는 역할을 맡아왔습니다.

  ---
  <mark>Key Strengths</mark>

  - 레거시 코드베이스 분석 및 유지보수 환경에서의 안정적인 기능 개선 경험
  - 엑셀·CSV 등 비정형 데이터 기반 시스템에서 데이터 정합성 확보 및 마이그레이션 설계
  - 서비스 운영 중 발생하는 오류·제약 조건을 구조적으로 정리하고 해결하는 문제 접근 방식
  - 급여·근로 정보 등 정확성이 중요한 도메인에서의 데이터 검증 및 처리 경험
  - 문서화와 협업을 통한 지속 가능한 개발 환경 구축

  ---
  <mark>Currently Learning</mark>

  - JVM 내부 구조와 메모리 흐름에 대한 이해를 바탕으로, 객체 생성·클래스 로딩·런타임 동작을 설명 가능한 수준으로 학습 중

  
content:
  - title: Experience
    layout: list
    content:
      - layout: left
        title: 엠디퍼트 (MDPERT)
        sub_title: 백엔드 개발자
        caption: 2026년 1월 ~ 현재
        description: |
          협회의 엔터프라이즈 시스템 구축과 운영을 담당하며, 트랜잭션 처리와 시스템 안정화 업무를 수행하고 있습니다.
 
          - **한국연식품협동조합연합회 수발주 시스템 유지보수 (2026.01 ~ 2026.07):**
            - B2B 수발주 비즈니스 로직 고도화 및 시스템 운영 안정화
            - React와 Java 기반 환경에서 프론트-백엔드 간 데이터 통신 최적화 및 유지보수
 
          사용 언어/프레임워크: **Java**, **React**

      - layout: left
        title: 휴램프로
        sub_title: 선임연구원
        caption: 2022년 9월 ~ 2024년 11월 (2년 3개월)
        description: |
          레거시 기반 노무사 플랫폼 환경에서 데이터 정합성 문제와 운영 이슈를 분석하고 개선하는 역할을 수행함.
          서비스 종료, 비정형 데이터 유입, 급여·근로 정보와 같은 민감 데이터 처리 상황에서 안정적인 시스템 운영을 목표로 개발 및 개선을 진행함.
 
          - **차세대 마이그레이션:** 기존 노무법인에서 사용하던 VB 기반 시스템의 데이터를 신규 휴램 플랫폼(Spring Boot & MyBatis)으로 유실 없이 이관
          - 엑셀·CSV 기반 비정형 데이터를 분석하여 임시 테이블 적재 → 검증 → 본 테이블 반영의 단계적 이관 프로세스 설계 및 정합성 확보
          - 데이터 오류 발생 시 전체 작업 실패가 아닌 행 단위 실패 처리 구조를 도입하여 운영 리스크 최소화
          - **모바일 기능 고도화:** 출퇴근 GPS 연동 좌표 암호화 구조 개선 및 사내 결재함 등 실무 사용자 피드백을 기민하게 반영한 기능 구현 (PHP, MySQL)
          - PHP 기반 레거시 시스템을 분석하여 외부 연동을 위한 API 형태로 점진적 분리
 
          사용 언어/프레임워크: **Java(Spring Boot)**, **PHP**, JavaScript, **React**, MyBatis, MySQL
 
      - layout: left
        title: 위즈코어 기술연구소
        sub_title: 연구원
        caption: 2020년 5월 - 2022년 8월 (2년 3개월)
        description: |
          국책과제(절삭공구 플랫폼) 및 사내벤처(도서 플랫폼)의 백엔드 아키텍처를 초기 단계부터 주도적으로 설계하고 구축함.
          레거시 환경에서 벗어나 모던 웹 아키텍처로의 전환 및 기술 검증을 주도적으로 경험함.
 
          - **아키텍처 스크래치 설계:** Spring Boot와 React 기반의 모던 웹 플랫폼 백엔드 아키텍처를 초기 단계부터 직접 설계 및 구축
          - **데이터 모델링:** JPA(Hibernate)를 활용하여 복잡한 비즈니스 엔티티 관계를 객체 지향적으로 매핑하고 개발 생산성 향상
          - 프론트엔드(React)와의 원활한 데이터 통신을 위한 명확한 RESTful API 엔드포인트 설계
          - 머신러닝 분석 결과를 시각화하기 위한 대시보드 백엔드 API 구현 및 데이터 처리 흐름 검증
 
          사용 언어/프레임워크: **Java(Spring Boot)**, **React**, **JPA(Hibernate)**, Python(FastAPI, Django), PostgreSQL
 
      - layout: left
        title: 제인소프트
        sub_title: 소프트웨어 엔지니어
        caption: 2018년 1월 - 2019년 4월 (1년 4개월)
        description: |
          KTEstate 사내 ERP 웹 프로젝트(OneSystem) 등 다수의 대규모 엔터프라이즈 시스템 연계 및 안정화 업무를 수행함.
 
          - **SAP 데이터 인터페이스 설계:** 방대한 사내 ERP 데이터를 SAP 시스템과 원활하게 연동하기 위한 백엔드 데이터 인터페이스 구축
          - **데이터 무결성 확보:** 이종 시스템 간 데이터 정합성을 보장하는 실시간 및 배치 데이터 동기화 파이프라인 구현
          - 다수 인원이 개발한 기존 시스템의 구조를 분석하여 재무·정산 모듈 등 정확성이 요구되는 프로시저 기반 로직 튜닝 및 장애 대응 주도
 
          사용 언어/프레임워크: **Java(Spring + MyBatis)**, **JSP**, JavaScript, **PostgreSQL**, SAP Interface
 
      - layout: left
        title: 원제로소프트
        sub_title: 연구원
        caption: 2016년 1월 - 2017년 7월 (1년 7개월)
        description: |
          웹 서비스 초기 단계에서 프론트엔드와 백엔드를 모두 경험하며 기본적인 웹 개발 역량을 축적함.
          사용자 입력 데이터 처리와 알림, 주문 흐름 등 서비스 핵심 기능 구현을 담당함.
 
          - 하이브리드 앱 환경에서 주문 알림 및 푸시 메시지 연동 기능 구현
          - 엑셀 업로드 기반 대량 단건/대량 데이터 입력 기능을 설계 및 구현
          - 사용자 입력 오류를 고려한 데이터 보정 및 병합 로직 개발
 
          사용 언어/프레임워크: **Classic ASP**, AngularJS, JavaScript(jQuery), MSSQL, Node.js

