  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: Python Real Estate Data Simulator (부동산 데이터 시뮬레이터)
        quote: >
          부동산 시장 트렌드 분석 및 장기 데이터 시각화를 위한 커스텀 시뮬레이터 개발
        description: |
          Python을 활용하여 주택 가격 추이, 지역별 재개발 구역 데이터 등을 수집하고 장기 시장 데이터를 차트화(Plotting)하는 커스텀 시뮬레이터를 개발했습니다. 단순한 기능 구현을 넘어, 방대한 데이터를 정제하고 시각화하여 실제 투자 분석과 의사결정에 활용하기 위한 목적으로 구축했습니다.

      - layout: top-middle
        title: SpringBoot Clean Architecture Template
        link: https://github.com/hyungseokkim/springboot-clean-architecture
        additional_links:
          - title: hyungseokkim/springboot-clean-architecture
            icon: fab fa-github
            url: https://github.com/hyungseokkim/springboot-clean-architecture
        quote: >
          실무에서 바로 사용할 수 있는 구조화된 SpringBoot 템플릿
        description: |
          클린 아키텍처 기반으로 구성된 Spring Boot 템플릿 프로젝트입니다. 계층 간의 명확한 책임 분리와 공통 응답 포맷, 예외 처리, Swagger 문서화, MyBatis 연동 등을 포함하여 실제 현업 투입에 필요한 구성을 정리했습니다.
          
          신규 프로젝트를 시작할 때 반복되는 기본 작업을 줄이고, 팀원 간 협업과 유지보수가 수월하도록 설계되었습니다.

      - layout: top-middle
        title: 포트폴리오
        link: https://tasteful-hardcover-8f9.notion.site/135b4bd60fd980e0a2cddb425204e5b5
        description: |
          실제 참여한 프로젝트 목록이며, 상세 내용은 위의 노션 링크에서 확인하실 수 있습니다.


